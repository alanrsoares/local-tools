[package]
name = "scaffold"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

# Pure, deterministic, offline project scaffolder that replaces the five
# `*-init` helpers in ~/.fns. No external dependencies on purpose: it emits
# the user's known-good config files directly so the first `cargo build` and
# every test run work with no network access.

[[bin]]
name = "scaffold"
path = "src/main.rs"

[dependencies]
local-common = { path = "../local-common" }

[lints]
workspace = true
